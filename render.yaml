services:
  - type: web
    name: parser-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 120 --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: ANTHROPIC_API_KEY
        sync: false
